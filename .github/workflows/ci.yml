name: PlatformIO CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
          
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Prepare config.h
      run: cp src/config.h.example src/config.h
      
    - name: Build Firmware (esp32s3)
      run: pio run -e esp32s3

  deploy_to_hardware:
    needs: build_and_test
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare real config.h
      run: cp /home/jouni/secret_config.h src/config.h
    
    - name: Build and Upload to ESP32
      run: pio run -e esp32s3 -t upload
